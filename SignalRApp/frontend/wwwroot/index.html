<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BombBoy</title>
    <!-- Microsoft SignalR Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #181a1b;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            gap: 12px;
            user-select: none;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 26px;
            letter-spacing: 2px;
            color: #f39c12;
            margin-bottom: 4px;
        }

        /* Status & Info Bar */
        .hud-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            background: #23272a;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-dot.connected {
            background: #2ecc71;
        }

        .status-dot.connecting {
            background: #f1c40f;
        }

        .player-tag {
            color: #3498db;
            font-weight: bold;
        }

        /* Game Board Container */
        #game-container {
            position: relative;
            background: #27ae60;
            border: 4px solid #1e824c;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* Map Grid layer */
        #map-grid {
            position: relative;
            display: grid;
        }

        /* Tile Styles */
        .tile {
            width: 40px;
            height: 40px;
            position: absolute;
            box-sizing: border-box;
        }

        /* Floor: Walkable grass */
        .tile-floor {
            background-color: #27ae60;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Indestructible Wall (X) */
        .tile-wall {
            background: linear-gradient(135deg, #5c6b73 0%, #343f45 100%);
            border: 2px solid #1f272b;
            border-radius: 4px;
            box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.2), inset -1px -1px 2px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-wall::after {
            content: "🪨";
            font-size: 16px;
            filter: grayscale(80%) brightness(70%);
        }

        /* Breakable Block (B) */
        .tile-block {
            background: linear-gradient(135deg, #d35400 0%, #b94a00 100%);
            border: 2px solid #6e2c00;
            border-radius: 4px;
            box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.35), inset -1px -1px 2px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-block::after {
            content: "🧱";
            font-size: 18px;
        }

        /* Player Layer */
        #players-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .player {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            transition: left 0.08s linear, top 0.08s linear;
            border: 2px solid #fff;
            z-index: 10;
        }

        /* Local Player Highlight */
        .player.is-me {
            border: 2px solid #f1c40f;
            box-shadow: 0 0 10px #f1c40f, 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .player.is-me::before {
            content: "▼";
            position: absolute;
            top: -14px;
            font-size: 10px;
            color: #f1c40f;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-3px); }
        }

        /* Instructions & Info */
        .footer-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #888;
        }

        .controls-hint strong {
            color: #ddd;
        }

        /* On-Screen D-Pad (convenient for mouse testing) */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 38px);
            grid-template-rows: repeat(2, 38px);
            gap: 4px;
            margin-top: 4px;
        }

        .dpad-btn {
            background: #2c3e50;
            color: #ecf0f1;
            border: 1px solid #34495e;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-btn:active {
            background: #34495e;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>💣 BOMBBOY</h1>
        <div class="hud-bar">
            <div class="status-badge">
                <div id="status-dot" class="status-dot connecting"></div>
                <span id="status-text">Connecting...</span>
            </div>
            <div>Player: <span id="my-name" class="player-tag">Connecting...</span></div>
            <div>Pos: <span id="my-pos" style="color: #aaa;">(-, -)</span></div>
            <div>Players: <span id="player-count" style="font-weight: bold; color: #2ecc71;">0</span>/4</div>
        </div>
    </header>

    <!-- Game Board -->
    <div id="game-container">
        <div id="map-grid"></div>
        <div id="players-layer"></div>
    </div>

    <div class="footer-info">
        <div class="controls-hint">
            Move: <strong>W, A, S, D</strong> or <strong>Arrow Keys</strong> &nbsp;|&nbsp; Bomb: <strong>Spacebar</strong>
        </div>

        <!-- Optional D-Pad for mouse testing -->
        <div class="dpad">
            <div></div>
            <button class="dpad-btn" onclick="sendMove(0, -1)" title="Up">▲</button>
            <div></div>
            <button class="dpad-btn" onclick="sendMove(-1, 0)" title="Left">◀</button>
            <button class="dpad-btn" onclick="sendMove(0, 1)" title="Down">▼</button>
            <button class="dpad-btn" onclick="sendMove(1, 0)" title="Right">▶</button>
        </div>
    </div>

    <script>
        const TILE_SIZE = 40;
        const PLAYER_COLORS = ["#3498db", "#e74c3c", "#2ecc71", "#f39c12"];

        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const myNameEl = document.getElementById("my-name");
        const myPosEl = document.getElementById("my-pos");
        const playerCountEl = document.getElementById("player-count");
        const gameContainer = document.getElementById("game-container");
        const mapGridEl = document.getElementById("map-grid");
        const playersLayerEl = document.getElementById("players-layer");

        let myConnectionId = null;
        let mapData = null;
        let lastMoveTime = 0;
        const MOVE_COOLDOWN_MS = 100; // Small delay to avoid input flooding

        // 1. SIGNALR CONNECTION
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/hub")
            .withAutomaticReconnect()
            .build();

        // 2. RECEIVE PLAYER ID
        connection.on("ReceivePlayerId", (id) => {
            myConnectionId = id;
            console.log("Assigned Connection ID:", id);
        });

        // 3. RECEIVE MAP DATA
        connection.on("ReceiveMap", (rawMap) => {
            try {
                mapData = typeof rawMap === "string" ? JSON.parse(rawMap) : rawMap;
                renderMap(mapData);
            } catch (err) {
                console.error("Failed to parse map data:", err);
            }
        });

        // 4. RECEIVE PLAYERS LIST (from UpdatePlayers or Gametick)
        connection.on("UpdatePlayers", (players) => {
            renderPlayers(players);
        });

        connection.on("Gametick", (players) => {
            renderPlayers(players);
        });

        // 5. CONNECT TO SERVER
        connection.start()
            .then(() => {
                statusDot.className = "status-dot connected";
                statusText.textContent = "Connected";
                if (!myConnectionId && connection.connectionId) {
                    myConnectionId = connection.connectionId;
                }
                // Request map in case ReceiveMap wasn't received during handshake
                if (!mapData) {
                    connection.invoke("GetMap")
                        .then(raw => {
                            if (raw) {
                                mapData = typeof raw === "string" ? JSON.parse(raw) : raw;
                                renderMap(mapData);
                            }
                        })
                        .catch(err => console.log("GetMap invoke optional:", err));
                }
            })
            .catch(err => {
                console.error("SignalR Connection Error:", err);
                statusDot.className = "status-dot";
                statusText.textContent = "Disconnected";
                myNameEl.textContent = "Offline";
            });

        connection.onreconnecting(() => {
            statusDot.className = "status-dot connecting";
            statusText.textContent = "Reconnecting...";
        });

        connection.onreconnected(() => {
            statusDot.className = "status-dot connected";
            statusText.textContent = "Connected";
            if (connection.connectionId) myConnectionId = connection.connectionId;
        });

        // 6. RENDER MAP
        function renderMap(grid) {
            if (!grid || !grid.length) return;

            mapGridEl.innerHTML = "";
            const sizeX = grid.length;
            const sizeY = grid[0].length;

            gameContainer.style.width = (sizeX * TILE_SIZE) + "px";
            gameContainer.style.height = (sizeY * TILE_SIZE) + "px";

            for (let x = 0; x < sizeX; x++) {
                for (let y = 0; y < sizeY; y++) {
                    const tileType = grid[x][y];
                    const tileEl = document.createElement("div");
                    tileEl.className = "tile";
                    tileEl.style.left = (x * TILE_SIZE) + "px";
                    tileEl.style.top = (y * TILE_SIZE) + "px";

                    if (tileType === "X") {
                        tileEl.classList.add("tile-wall");
                        tileEl.title = "Wall";
                    } else if (tileType === "B") {
                        tileEl.classList.add("tile-block");
                        tileEl.title = "Block";
                    } else {
                        tileEl.classList.add("tile-floor");
                    }

                    mapGridEl.appendChild(tileEl);
                }
            }
        }

        // 7. RENDER PLAYERS
        function renderPlayers(players) {
            if (!Array.isArray(players)) return;

            playersLayerEl.innerHTML = "";
            playerCountEl.textContent = players.length;

            let foundMe = false;

            players.forEach((player, index) => {
                const id = player.id || player.Id;
                const name = player.name || player.Name || `P${index + 1}`;
                const x = player.x !== undefined ? player.x : player.X;
                const y = player.y !== undefined ? player.y : player.Y;
                const isMe = (myConnectionId && id === myConnectionId) || (!foundMe && players.length === 1);

                if (isMe) {
                    foundMe = true;
                    myNameEl.textContent = name;
                    myPosEl.textContent = `(${x}, ${y})`;
                }

                const playerEl = document.createElement("div");
                playerEl.className = "player" + (isMe ? " is-me" : "");
                playerEl.style.backgroundColor = PLAYER_COLORS[index % PLAYER_COLORS.length];
                playerEl.style.left = (x * TILE_SIZE + 4) + "px";
                playerEl.style.top = (y * TILE_SIZE + 4) + "px";
                playerEl.textContent = name.slice(-2).toUpperCase();
                playerEl.title = `${name} (${x}, ${y})`;

                playersLayerEl.appendChild(playerEl);
            });
        }

        // 8. SEND MOVEMENT
        function sendMove(dx, dy) {
            const now = Date.now();
            if (now - lastMoveTime < MOVE_COOLDOWN_MS) return;
            lastMoveTime = now;

            if (connection.state === signalR.HubConnectionState.Connected) {
                connection.invoke("Move", dx, dy).catch(err => {
                    console.error("Move error:", err);
                });
            }
        }

        // 9. BOMB ACTION
        function placeBomb() {
            if (connection.state === signalR.HubConnectionState.Connected) {
                connection.invoke("PlaceBomb").catch(err => {
                    console.log("PlaceBomb invoke (backend implementation pending):", err.message);
                });
            }
        }

        // 10. KEYBOARD LISTENER
        window.addEventListener("keydown", (event) => {
            if (event.code === "Space" || event.key === " ") {
                event.preventDefault();
                placeBomb();
                return;
            }

            let dx = 0;
            let dy = 0;

            const key = event.key.toLowerCase();
            if (key === "arrowup" || key === "w") dy = -1;
            else if (key === "arrowdown" || key === "s") dy = 1;
            else if (key === "arrowleft" || key === "a") dx = -1;
            else if (key === "arrowright" || key === "d") dx = 1;

            if (dx !== 0 || dy !== 0) {
                event.preventDefault();
                sendMove(dx, dy);
            }
        });
    </script>
</body>
</html>
