<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BombBoy</title>
    <!-- Microsoft SignalR Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #181a1b;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            gap: 12px;
            user-select: none;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 26px;
            letter-spacing: 2px;
            color: #f39c12;
            margin-bottom: 4px;
        }

        /* Status & Info Bar */
        .hud-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            background: #23272a;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-dot.connected {
            background: #2ecc71;
        }

        .status-dot.connecting {
            background: #f1c40f;
        }

        .player-tag {
            color: #3498db;
            font-weight: bold;
        }

        .strategy-picker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .strategy-select {
            background: #181a1b;
            color: #f39c12;
            border: 1px solid #555;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        .strategy-select:focus {
            border-color: #f39c12;
        }

        /* Bomb Tile Animation */
        .tile-bomb {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bomb-pulse 0.6s infinite alternate;
        }

        .tile-bomb::after {
            content: "💣";
            font-size: 24px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.7));
        }

        @keyframes bomb-pulse {
            from { transform: scale(0.95); }
            to { transform: scale(1.12); }
        }

        /* Blast / Fire Tile Animation */
        .tile-blast {
            background: radial-gradient(circle, #ffe600 0%, #ff5722 60%, #b71c1c 100%) !important;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px #ff5722, inset 0 0 8px #ffe600;
            animation: blast-flicker 0.12s infinite alternate;
        }

        .tile-blast::after {
            content: "💥";
            font-size: 22px;
        }

        @keyframes blast-flicker {
            from { filter: brightness(1); }
            to { filter: brightness(1.25); }
        }

        .player.is-dead {
            opacity: 0.35;
            filter: grayscale(100%);
            border: 2px dashed #e74c3c;
        }

        /* Game Board Container */
        #game-container {
            position: relative;
            background: #27ae60;
            border: 4px solid #1e824c;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* Map Grid layer */
        #map-grid {
            position: relative;
            z-index: 1;
        }

        /* Tile Styles */
        .tile {
            width: 40px;
            height: 40px;
            position: absolute;
            box-sizing: border-box;
        }

        /* Floor: Walkable grass */
        .tile-floor {
            background-color: #27ae60;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Indestructible Wall (X) */
        .tile-wall {
            background: linear-gradient(135deg, #5c6b73 0%, #343f45 100%);
            border: 2px solid #1f272b;
            border-radius: 4px;
            box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.2), inset -1px -1px 2px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-wall::after {
            content: "🪨";
            font-size: 16px;
            filter: grayscale(80%) brightness(70%);
        }

        /* Breakable Block (B) */
        .tile-block {
            background: linear-gradient(135deg, #d35400 0%, #b94a00 100%);
            border: 2px solid #6e2c00;
            border-radius: 4px;
            box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.35), inset -1px -1px 2px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-block::after {
            content: "🧱";
            font-size: 18px;
        }

        /* Entity Layer (Z-Index above Map Tile Layer) */
        #entities-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .entity {
            position: absolute;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Player Layer (Z-Index above Entity Layer) */
        #players-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .player {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            transition: left 0.08s linear, top 0.08s linear;
            border: 2px solid #fff;
        }

        /* Local Player Highlight */
        .player.is-me {
            border: 2px solid #f1c40f;
            box-shadow: 0 0 10px #f1c40f, 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        .player.is-me::before {
            content: "▼";
            position: absolute;
            top: -14px;
            font-size: 10px;
            color: #f1c40f;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-3px); }
        }

        /* Instructions & Info */
        .footer-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #888;
        }

        .controls-hint strong {
            color: #ddd;
        }

        /* On-Screen D-Pad (convenient for mouse testing) */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 38px);
            grid-template-rows: repeat(2, 38px);
            gap: 4px;
            margin-top: 4px;
        }

        .dpad-btn {
            background: #2c3e50;
            color: #ecf0f1;
            border: 1px solid #34495e;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dpad-btn:active {
            background: #34495e;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>💣 BOMBBOY</h1>
        <div class="hud-bar">
            <div class="status-badge">
                <div id="status-dot" class="status-dot connecting"></div>
                <span id="status-text">Connecting...</span>
            </div>
            <div>Player: <span id="my-name" class="player-tag">Connecting...</span></div>
            <div>Pos: <span id="my-pos" style="color: #aaa;">(-, -)</span></div>
            <div>Players: <span id="player-count" style="font-weight: bold; color: #2ecc71;">0</span>/4</div>
            <div class="strategy-picker">
                <label for="strategy-select">Bomb Strategy:</label>
                <select id="strategy-select" class="strategy-select" onchange="onStrategyChange(this.value)">
                    <option value="classic">1. Classic (Cross +)</option>
                    <option value="diagonal">2. Diagonal (X-Shape)</option>
                    <option value="area">3. Area Box (3x3)</option>
                    <option value="piercing">4. Piercing (Penetrating)</option>
                    <option value="floodfill">5. Flood Fill (BFS)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Game Board -->
    <div id="game-container">
        <div id="map-grid"></div>
        <div id="entities-layer"></div>
        <div id="players-layer"></div>
    </div>

    <div class="footer-info">
        <div class="controls-hint">
            Move: <strong>W, A, S, D</strong> or <strong>Arrow Keys</strong> &nbsp;|&nbsp;
            Bomb: <strong>Spacebar</strong> &nbsp;|&nbsp;
            Strategy: <strong>1-5</strong>
        </div>

        <!-- Optional D-Pad for mouse testing -->
        <div class="dpad">
            <div></div>
            <button class="dpad-btn" onclick="sendMove(0, -1)" title="Up">▲</button>
            <div></div>
            <button class="dpad-btn" onclick="sendMove(-1, 0)" title="Left">◀</button>
            <button class="dpad-btn" onclick="sendMove(0, 1)" title="Down">▼</button>
            <button class="dpad-btn" onclick="sendMove(1, 0)" title="Right">▶</button>
        </div>
    </div>

    <script>
        const TILE_SIZE = 40;
        const PLAYER_COLORS = ["#3498db", "#e74c3c", "#2ecc71", "#f39c12"];

        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const myNameEl = document.getElementById("my-name");
        const myPosEl = document.getElementById("my-pos");
        const playerCountEl = document.getElementById("player-count");
        const gameContainer = document.getElementById("game-container");
        const mapGridEl = document.getElementById("map-grid");
        const entitiesLayerEl = document.getElementById("entities-layer");
        const playersLayerEl = document.getElementById("players-layer");
        const strategySelectEl = document.getElementById("strategy-select");

        let myConnectionId = null;
        let gameState = null;
        let lastMoveTime = 0;
        const MOVE_COOLDOWN_MS = 100;
        let selectedStrategy = "classic";

        function onStrategyChange(newStrat) {
            selectedStrategy = newStrat;
            if (connection && connection.state === signalR.HubConnectionState.Connected) {
                connection.invoke("SetStrategy", selectedStrategy).catch(err => console.error("SetStrategy error:", err));
            }
        }

        // 1. SIGNALR CONNECTION
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/hub")
            .withAutomaticReconnect()
            .build();

        // 2. RECEIVE PLAYER ID
        connection.on("ReceivePlayerId", (id) => {
            myConnectionId = id;
            console.log("Assigned Connection ID:", id);
        });

        // 3. RECEIVE GAME STATE / MAP DATA
        connection.on("ReceiveMap", (rawData) => {
            handleGameStateUpdate(rawData);
        });

        // 4. RECEIVE PLAYERS LIST / TICK UPDATE
        connection.on("UpdatePlayers", (data) => {
            handleGameStateUpdate(data);
        });

        connection.on("Gametick", (data) => {
            handleGameStateUpdate(data);
        });

        function handleGameStateUpdate(rawData) {
            try {
                const parsed = typeof rawData === "string" ? JSON.parse(rawData) : rawData;
                
                // If standard object with layers is received
                if (parsed && (parsed.MapLayer || parsed.EntityLayer || parsed.PlayerLayer)) {
                    gameState = parsed;
                    if (gameState.MapLayer) renderMap(gameState.MapLayer);
                    if (gameState.EntityLayer) renderEntities(gameState.EntityLayer);
                    if (gameState.PlayerLayer) renderPlayers(gameState.PlayerLayer);
                } 
                // Fallback handling if receiving raw Map array or raw Player array
                else if (Array.isArray(parsed)) {
                    if (Array.isArray(parsed[0])) {
                        renderMap(parsed);
                    } else {
                        renderPlayers(parsed);
                    }
                }
            } catch (err) {
                console.error("Failed to parse server payload:", err);
            }
        }

        // 5. CONNECT TO SERVER
        connection.start()
            .then(() => {
                statusDot.className = "status-dot connected";
                statusText.textContent = "Connected";
                if (!myConnectionId && connection.connectionId) {
                    myConnectionId = connection.connectionId;
                }
                connection.invoke("GetMap")
                    .then(raw => {
                        if (raw) handleGameStateUpdate(raw);
                    })
                    .catch(err => console.log("GetMap invoke optional:", err));
            })
            .catch(err => {
                console.error("SignalR Connection Error:", err);
                statusDot.className = "status-dot";
                statusText.textContent = "Disconnected";
                myNameEl.textContent = "Offline";
            });

        connection.onreconnecting(() => {
            statusDot.className = "status-dot connecting";
            statusText.textContent = "Reconnecting...";
        });

        connection.onreconnected(() => {
            statusDot.className = "status-dot connected";
            statusText.textContent = "Connected";
            if (connection.connectionId) myConnectionId = connection.connectionId;
        });

        // 6. RENDER MAP (Tiles)
        let lastMapSerialized = "";
        function renderMap(mapLayer) {
            if (!mapLayer || !mapLayer.length) return;

            const serialized = JSON.stringify(mapLayer);
            if (serialized === lastMapSerialized) return;
            lastMapSerialized = serialized;

            mapGridEl.innerHTML = "";
            const sizeX = mapLayer.length;
            const sizeY = mapLayer[0].length;

            gameContainer.style.width = (sizeX * TILE_SIZE) + "px";
            gameContainer.style.height = (sizeY * TILE_SIZE) + "px";

            for (let x = 0; x < sizeX; x++) {
                for (let y = 0; y < sizeY; y++) {
                    const tileType = mapLayer[x][y];
                    const tileEl = document.createElement("div");
                    tileEl.className = "tile";
                    tileEl.style.left = (x * TILE_SIZE) + "px";
                    tileEl.style.top = (y * TILE_SIZE) + "px";

                    if (tileType === "X") {
                        tileEl.classList.add("tile-wall");
                        tileEl.title = "Wall";
                    } else if (tileType === "B") {
                        tileEl.classList.add("tile-block");
                        tileEl.title = "Block";
                    } else {
                        tileEl.classList.add("tile-floor");
                    }

                    mapGridEl.appendChild(tileEl);
                }
            }
        }

        // 7. RENDER ENTITIES (Bombs, items, etc. between Map & Players)
        function renderEntities(entityLayer) {
            entitiesLayerEl.innerHTML = "";
            if (!entityLayer) return;

            // Handle Array of Entities
            if (Array.isArray(entityLayer)) {
                entityLayer.forEach(entity => {
                    const x = entity.x !== undefined ? entity.x : entity.X;
                    const y = entity.y !== undefined ? entity.y : entity.Y;
                    const icon = entity.icon || entity.Type || "💣";

                    if (x !== undefined && y !== undefined) {
                        createEntityElement(x, y, icon);
                    }
                });
            } 
            // Handle Key-Value Object format (e.g. {"2,1": {Id: "Bomb"}})
            else if (typeof entityLayer === "object") {
                Object.keys(entityLayer).forEach(key => {
                    const coords = key.split(",").map(Number);
                    if (coords.length === 2) {
                        const [x, y] = coords;
                        const item = entityLayer[key];
                        const icon = typeof item === "string" ? item : (item.Icon || item.Type || "💣");
                        createEntityElement(x, y, icon);
                    }
                });
            }
        }

        function createEntityElement(x, y, symbol) {
            const entEl = document.createElement("div");
            entEl.className = "entity";
            entEl.style.left = (x * TILE_SIZE) + "px";
            entEl.style.top = (y * TILE_SIZE) + "px";

            if (symbol === "💣" || symbol === "O" || symbol === "Bomb") {
                entEl.classList.add("tile-bomb");
            } else if (symbol === "💥" || symbol === "*" || symbol === "Blast") {
                entEl.classList.add("tile-blast");
            } else {
                entEl.textContent = symbol;
            }

            entitiesLayerEl.appendChild(entEl);
        }

        // 8. RENDER PLAYERS
        function renderPlayers(playerLayer) {
            playersLayerEl.innerHTML = "";
            if (!playerLayer) return;

            let playerList = [];

            // Parse array vs dictionary-style PlayerLayer (e.g., [{"2,1": {"Id":"P1", "Direction":"right"}}])
            if (Array.isArray(playerLayer)) {
                playerLayer.forEach((item, idx) => {
                    if (item.x !== undefined || item.X !== undefined) {
                        playerList.push(item);
                    } else if (typeof item === "object") {
                        Object.keys(item).forEach(coordKey => {
                            const [x, y] = coordKey.split(",").map(Number);
                            playerList.push({
                                x: x,
                                y: y,
                                ...item[coordKey]
                            });
                        });
                    }
                });
            } else if (typeof playerLayer === "object") {
                Object.keys(playerLayer).forEach(coordKey => {
                    const [x, y] = coordKey.split(",").map(Number);
                    playerList.push({
                        x: x,
                        y: y,
                        ...playerLayer[coordKey]
                    });
                });
            }

            playerCountEl.textContent = playerList.length;
            let foundMe = false;

            playerList.forEach((player, index) => {
                const id = player.id || player.Id || `P${index + 1}`;
                const name = player.name || player.Name || id;
                const x = player.x !== undefined ? player.x : player.X;
                const y = player.y !== undefined ? player.y : player.Y;
                const isMe = (myConnectionId && id === myConnectionId) || (!foundMe && playerList.length === 1);

                const isAlive = player.isAlive !== undefined ? player.isAlive : (player.IsAlive !== undefined ? player.IsAlive : true);

                if (isMe) {
                    foundMe = true;
                    myNameEl.textContent = name + (isAlive ? "" : " (DEAD)");
                    myPosEl.textContent = `(${x}, ${y})`;
                }

                const playerEl = document.createElement("div");
                playerEl.className = "player" + (isMe ? " is-me" : "") + (isAlive ? "" : " is-dead");
                playerEl.style.backgroundColor = PLAYER_COLORS[index % PLAYER_COLORS.length];
                playerEl.style.left = (x * TILE_SIZE + 4) + "px";
                playerEl.style.top = (y * TILE_SIZE + 4) + "px";
                playerEl.textContent = isAlive ? name.slice(-2).toUpperCase() : "☠";
                playerEl.title = `${name} (${x}, ${y}) - ${isAlive ? 'Alive' : 'Dead'}`;

                playersLayerEl.appendChild(playerEl);
            });
        }

        // 9. SEND MOVEMENT
        function sendMove(dx, dy) {
            const now = Date.now();
            if (now - lastMoveTime < MOVE_COOLDOWN_MS) return;
            lastMoveTime = now;

            if (connection.state === signalR.HubConnectionState.Connected) {
                connection.invoke("Move", dx, dy).catch(err => {
                    console.error("Move error:", err);
                });
            }
        }

        // 10. BOMB ACTION
        function placeBomb() {
            if (connection && connection.state === signalR.HubConnectionState.Connected) {
                connection.invoke("PlaceBomb", selectedStrategy).catch(err => {
                    console.error("PlaceBomb error:", err);
                });
            }
        }

        // 11. KEYBOARD LISTENER
        window.addEventListener("keydown", (event) => {
            // Strategy selection keys: 1, 2, 3, 4, 5
            if (event.key === "1") {
                strategySelectEl.value = "classic";
                onStrategyChange("classic");
                return;
            } else if (event.key === "2") {
                strategySelectEl.value = "diagonal";
                onStrategyChange("diagonal");
                return;
            } else if (event.key === "3") {
                strategySelectEl.value = "area";
                onStrategyChange("area");
                return;
            } else if (event.key === "4") {
                strategySelectEl.value = "piercing";
                onStrategyChange("piercing");
                return;
            } else if (event.key === "5") {
                strategySelectEl.value = "floodfill";
                onStrategyChange("floodfill");
                return;
            }

            if (event.code === "Space" || event.key === " ") {
                event.preventDefault();
                placeBomb();
                return;
            }

            let dx = 0;
            let dy = 0;

            const key = event.key.toLowerCase();
            if (key === "arrowup" || key === "w") dy = -1;
            else if (key === "arrowdown" || key === "s") dy = 1;
            else if (key === "arrowleft" || key === "a") dx = -1;
            else if (key === "arrowright" || key === "d") dx = 1;

            if (dx !== 0 || dy !== 0) {
                event.preventDefault();
                sendMove(dx, dy);
            }
        });
    </script>
</body>
</html>
